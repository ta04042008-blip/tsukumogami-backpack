name: Validate Prototype

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check game-data.js
          node --check app.js
          node --check interaction.js

      - name: Check required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f pixel-theme.css
          test -f ui-rebuild.css
          test -f assets/tsukumoshi_idle_right_64x64.png
          test -f app.js
          test -f game-data.js
          test -f interaction.js
          test -f interaction.css
          test -f GAME_DESIGN.md
          grep -q 'styles.css' index.html
          grep -q 'pixel-theme.css' index.html
          grep -q 'ui-rebuild.css' index.html
          grep -q 'game-data.js' index.html
          grep -q 'app.js' index.html
          grep -q 'interaction.js' index.html
          grep -q 'interaction.css' index.html
          grep -q 'stageMap' index.html
          grep -q 'itemDetailStats' index.html
          grep -q 'tsukumoshi_idle_right_64x64.png' index.html
          grep -q 'ui-rebuild.css' index.html

      - name: Smoke-test static serving
        run: |
          python3 -m http.server 8000 >/tmp/tsukumogami-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8000/pixel-theme.css >/dev/null
          curl --fail --silent http://127.0.0.1:8000/ui-rebuild.css >/dev/null
          curl --fail --silent http://127.0.0.1:8000/game-data.js >/dev/null
          curl --fail --silent http://127.0.0.1:8000/app.js >/dev/null
